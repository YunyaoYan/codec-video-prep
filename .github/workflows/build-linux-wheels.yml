name: Build Linux wheels

on:
  workflow_dispatch:

jobs:
  linux-x86-64:
    name: Linux x86_64 wheels
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build wheels
        run: bash scripts/build_all_manylinux_x86_64.sh

      - name: Check wheels
        run: |
          python3 -m pip install -U twine
          python3 -m twine check wheelhouse_x86_64/*.whl

      - name: Check selected-frame bitcost
        run: |
          python3 -m pip install --force-reinstall wheelhouse_x86_64/*cp310*.whl
          python3 scripts/check_selected_bitcost.py

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-wheels
          path: wheelhouse_x86_64/*.whl
          if-no-files-found: error

  linux-aarch64:
    name: Linux aarch64 wheels
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build and wheel tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            zip \
            unzip

      - name: Build wheels
        run: bash scripts/build_all_manylinux_aarch64.sh

      - name: Check wheels
        run: |
          python3 -m pip install -U twine
          python3 -m twine check wheelhouse_aarch64/*.whl

      - name: Check selected-frame bitcost
        run: |
          python3 -m pip install --force-reinstall wheelhouse_aarch64/*cp310*.whl
          python3 scripts/check_selected_bitcost.py

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64-wheels
          path: wheelhouse_aarch64/*.whl
          if-no-files-found: error
