[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
    "numpy>=1.23,<2.0; python_version < '3.14'",
    "numpy>=2.0,<3.0; python_version >= '3.14'",
]
build-backend = "setuptools.build_meta"

[project]
name = "codec-video-prep"
version = "0.2.6"
description = "Codec-aware video preprocessing for training and inference"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["video", "codec", "bitcost", "preprocessing", "ffmpeg", "h264", "hevc", "vp9"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.23,<2.0; python_version < '3.14'",
    "numpy>=2.0,<3.0; python_version >= '3.14'",
    "opencv-python-headless<4.12",
    "Pillow",
]

[project.scripts]
codec-video-prep = "codec_video_prep.cli:main"
codec-video-prep-doctor = "codec_video_prep.doctor:main"
cv-preinfer = "compressed_video_preinfer.cli:main"
cv-preinfer-doctor = "compressed_video_preinfer.doctor:main"

[project.urls]
Homepage = "https://github.com/YunyaoYan/codec-video-prep"
Documentation = "https://github.com/YunyaoYan/codec-video-prep#readme"
Issues = "https://github.com/YunyaoYan/codec-video-prep/issues"
